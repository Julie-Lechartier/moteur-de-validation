name: Build, Test, Publish and Deploy React Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_test:

    runs-on: macos-15

    strategy:
      matrix:
        node-version: [20.x]

    defaults:
      run:
        working-directory: ./my-app

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3


      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}


      - name: Install dependencies
        run: npm ci


      - name: Build application
        run: npm run build --if-present


      - name: Run tests
        run: npm test


      - name: Generate JSDoc
        run: npx jsdoc -R ./README.md -r ./src -d ./docs


      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./my-app
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


      - name: Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./my-app
          build: npm run build
          start: npm start


      - name: Prepare artifact
        run: |
          mkdir -p ../artifact
          cp -r build/* ../artifact/
          cp -r docs ../artifact/docs


      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./artifact


  publish-npm:

    needs: build_test

    runs-on: macos-15

    defaults:
      run:
        working-directory: ./my-app

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3


      - name: Setup Node.js with NPM registry
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/


      - name: Install dependencies
        run: npm ci


      - name: Check version on NPM
        id: version_check
        run: |

          LOCAL_VERSION=$(node -p "require('./package.json').version")

          NPM_VERSION=$(npm view julie-ci-cd-ynov-moteur-validation version || echo "0.0.0")

          echo "Local version: $LOCAL_VERSION"
          echo "NPM version: $NPM_VERSION"

          if [ "$LOCAL_VERSION" = "$NPM_VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi


      - name: Build NPM package
        if: steps.version_check.outputs.skip == 'false'
        run: npm run build-npm-ci


      - name: Publish package to NPM
        if: steps.version_check.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


      - name: Skip publish
        if: steps.version_check.outputs.skip == 'true'
        run: echo "Version already published. Skipping publication."

  deploy:

    needs: publish-npm

    runs-on: macos-15

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
