name: Build, Test, Publish and Deploy React Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_test:

    runs-on: macos-15

    strategy:
      matrix:
        node-version: [20.x]

    defaults:
      run:
        working-directory: ./my-app

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3


      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}


      - name: Install dependencies
        run: npm ci


      - name: Build application
        run: npm run build --if-present


      - name: Run tests
        run: npm test


      - name: Generate JSDoc
        run: npx jsdoc -R ./README.md -r ./src -d ./docs


      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./my-app
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


      - name: Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./my-app
          build: npm run build
          start: npm start


      - name: Prepare artifact
        run: |
          mkdir -p ../artifact
          cp -r build/* ../artifact/
          cp -r docs ../artifact/docs


      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./artifact


  publish-npm:

    needs: build_test

    runs-on: macos-15

    defaults:
      run:
        working-directory: ./my-app

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3


      - name: Setup Node.js with NPM registry
        uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/


      - name: Install dependencies
        run: npm ci


      - name: Check version on NPM
        id: version_check
        run: |

          LOCAL_VERSION=$(node -p "require('./package.json').version")

          NPM_VERSION=$(npm view julie-ci-cd-ynov-moteur-validation version || echo "0.0.0")

          echo "Local version: $LOCAL_VERSION"
          echo "NPM version: $NPM_VERSION"

          if [ "$LOCAL_VERSION" = "$NPM_VERSION" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi


      - name: Build NPM package
        if: steps.version_check.outputs.skip == 'false'
        run: npm run build-npm-ci


      - name: Publish package to NPM
        if: steps.version_check.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}


      - name: Skip publish
        if: steps.version_check.outputs.skip == 'true'
        run: echo "Version already published. Skipping publication."

  validate-api:
    needs: publish-npm
    runs-on: ubuntu-latest
    
    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: testdb
      MYSQL_USER: root
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Démarrer MySQL
        run: |
          docker run -d \
            --name mysql_test \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE="$MYSQL_DATABASE" \
            -e MYSQL_USER="$MYSQL_USER" \
            -p 3307:3306 \
            mysql:8.0
          
          sleep 20
          
          docker exec mysql_test mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" || (echo "MySQL pas prêt" && docker logs mysql_test && exit 1)
  
      - name: Build API
        run: docker build -t julie-my-app:latest ./my-app/api
  
      - name: Lancer API + test
        run: |
          docker run -d \
            --name fastapi_test \
            --link mysql_test:mysql \
            -e MYSQL_HOST=mysql \
            -e MYSQL_USER="$MYSQL_USER" \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE="$MYSQL_DATABASE" \
            -p 8000:8000 \
            julie-my-app:latest
          
          sleep 15
          curl -f http://localhost:8000/users || (echo "API KO" && docker logs fastapi_test && exit 1)
          
  
      - name: Push Docker si tout va bien
        if: success()
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker tag julie-my-app:latest "$DOCKER_USERNAME/julie-my-app:latest"
          docker push "$DOCKER_USERNAME/julie-my-app:latest"
  
      - name: Nettoyage
        if: always()
        run: |
          docker stop mysql_test fastapi_test || true
          docker rm mysql_test fastapi_test || true

  
  deploy:

    needs: publish-npm

    runs-on: macos-15

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
